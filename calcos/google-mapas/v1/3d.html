<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google 3D — SIDECEME</title>
  <!-- 🏙️ El 3D realista de Google (Photorealistic 3D Tiles, Map Tiles API) para reconocer el terreno del ejercicio.
       Lo abre «🏙️ 3D realista», en el selector de mapa base de la carta, DENTRO de la carta de la Mesa
       (3d.html?embebido=1#lat,lng,zoom en un iframe): la Mesa le manda el calco por postMessage y acá se dibuja
       pegado al terreno 3D (áreas, líneas, fichas, flechas y rótulos). Abierto solo (sin ?embebido) es el 3D sin
       calco, como antes. Usa la misma clave que google-mapas.js. CesiumJS dibuja los tiles.
       Si Google no entrega el 3D (cupo, clave, red), el calco igual se ve, sobre el satélite de Esri. -->
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/'</script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
  <script src="./google-mapas.js?v=20261025-fluido"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0e13; overflow: hidden; font: 600 12px Arial, sans-serif; color: #c3ced9 }
    #lienzo { position: absolute; inset: 0 }
    .barra { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: calc(100% - 24px);
      padding: 6px 10px; background: rgba(10, 16, 24, .9); border: 1px solid rgba(15, 181, 201, .45); border-radius: 6px; box-sizing: border-box }
    .barra b { color: #3de1f5; letter-spacing: .04em }
    .barra button, .barra label { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .18); color: #c3ced9; border-radius: 5px; padding: 4px 9px; font: 600 11px Arial, sans-serif; cursor: pointer }
    .barra button:hover, .barra label:hover { border-color: #0fb5c9; color: #3de1f5 }
    .barra label { display: inline-flex; align-items: center; gap: 4px }
    .barra label input { margin: 0 }
    .barra input[type=range] { width: 84px; accent-color: #0fb5c9; cursor: pointer }
    .barra select { background: #0a1018; color: #c3ced9; border: 1px solid rgba(255, 255, 255, .25); border-radius: 4px; font: 600 11px Arial, sans-serif; padding: 1px 2px; cursor: pointer }
    .barra #relieve-val { min-width: 24px; color: #3de1f5 }
    .barra .apagado { opacity: .45; cursor: default }
    .barra #volver { background: #0fb5c9; border-color: #0fb5c9; color: #04151a }
    .ayuda { color: #8fa1b3; font-weight: 400 }
    .aviso { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; max-width: min(520px, 90vw); padding: 14px 18px; border-radius: 8px;
      background: rgba(12, 18, 24, .95); border: 1px solid #d9a400; color: #ffd75e; text-align: center; line-height: 1.5; display: none }
    .aviso.chico { top: auto; bottom: 150px; transform: translateX(-50%); padding: 8px 14px; font-size: 11px }
    .solo-embebido, .embebido .solo-suelto { display: none }
    .embebido .solo-embebido { display: inline-flex }
    /* Dentro de la Mesa: los paneles de la Mesa tapan arriba y los costados de la carta; la barra y la atribución
       de Google («Google» y las fuentes de las imágenes, obligatorias) van abajo al centro, sobre el tablero. */
    .embebido .barra { left: 50%; top: auto; bottom: 86px; transform: translateX(-50%); justify-content: center; max-width: min(720px, calc(100% - 24px)) }
    #creditos { position: absolute; left: 50%; bottom: 62px; transform: translateX(-50%); z-index: 5; max-width: min(720px, calc(100% - 24px)); display: none;
      padding: 1px 6px; border-radius: 3px; background: rgba(0, 0, 0, .45); font: 500 10px Arial, sans-serif; color: #fff; white-space: nowrap; overflow: hidden }
    .embebido #creditos { display: block }
    #creditos .cesium-widget-credits { position: static; padding: 0 }
    #creditos a { color: #fff }
    #creditos img { vertical-align: middle; max-height: 16px }
    @media (max-width: 600px) { .ayuda { display: none } .embebido .barra { bottom: 70px } }
  </style>
</head>
<body>
  <div id="lienzo"></div>
  <div class="barra">
    <b>🏙️ GOOGLE 3D</b>
    <button id="cenital" title="Mirar desde arriba">⬇️ Desde arriba</button>
    <button id="oblicua" title="Volver a la vista inclinada del principio">↗️ Inclinada</button>
    <button id="norte" title="Girar para que el norte quede arriba">🧭 Norte</button>
    <label id="relieve" class="apagado" title="Exagerar el relieve del 3D de Google, como el «Relieve ×» del ⛰️ 3D de la Mesa (se activa cuando llega el 3D)">⛰️ Relieve ×<span id="relieve-val">2.0</span><input type="range" id="relieve-x" min="1" max="5" step="0.1" value="2" aria-label="Exagerar el relieve" disabled></label>
    <label title="Menos detalle = se navega más fluido (útil en computadoras lentas o con mucho calco)">⚡ <select id="detalle" aria-label="Detalle del 3D"><option value="alto">Detalle alto</option><option value="normal">Detalle normal</option><option value="fluido">Fluido</option></select></label>
    <label class="solo-embebido" title="Mostrar u ocultar lo trazado en la carta (áreas, líneas, fichas, rótulos)"><input type="checkbox" id="ver-calco" checked> Calco</label>
    <button id="recargar" class="solo-embebido" title="Volver a traer el calco de la carta (si lo cambiaste)">🔄 Calco</button>
    <button id="volver" class="solo-embebido" title="Cerrar el 3D de Google y volver a la carta">✕ Volver a la carta</button>
    <span class="ayuda solo-suelto">Arrastrá para moverte · rueda para acercar · Ctrl + arrastrar (o clic derecho) para inclinar y girar</span>
  </div>
  <div id="creditos"></div>
  <div class="aviso" id="aviso"></div>
  <script>
    'use strict'
    const embebido = /[?&]embebido=1/.test(location.search) && window.parent !== window
    if (embebido) document.body.classList.add('embebido')
    const aviso = (t, chico) => {
      const a = document.getElementById('aviso')
      a.textContent = t
      a.className = 'aviso' + (chico ? ' chico' : '')
      a.style.display = 'block'
      if (chico) setTimeout(() => (a.style.display = 'none'), 12000)
    }
    const aLaMesa = (datos) => {
      if (embebido) window.parent.postMessage(Object.assign({ sid3d: '' }, datos), location.origin === 'null' ? '*' : location.origin)
    }
    // Lo que eligió el usuario (relieve, detalle) queda para la próxima vez. Sin almacenamiento, los valores de siempre.
    const leer = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v } catch { return d } }
    const guardar = (k, v) => { try { localStorage.setItem(k, String(v)) } catch {} }
    // ⚡ Detalle: cuánto error en pantalla se acepta en los tiles de Google (Cesium usa 16), la resolución del dibujo
    // y el suavizado de bordes. «Normal» ya es más liviano que lo de Cesium: Sergio (23-10-2026), «para navegar está
    // muy lenta, muy lenta»; y después, «la velocidad sigue mal» (normal pasó de 24 a 32 y sin suavizado).
    const DETALLE = {
      alto: { sse: 16, escala: 1, msaa: 4 },
      normal: { sse: 32, escala: 1, msaa: 1 },
      fluido: { sse: 48, escala: 0.6, msaa: 1 },
    }
    // Dentro de la Mesa, la barra va donde no la tapen los paneles: la Mesa mide qué parte de la carta está libre y
    // manda el lugar (antes iba fija abajo y el tablero del plan de barreras la tapaba entera: Sergio, 23-10-2026, «el
    // medidor ese de relieve no hay o no funciona»). La atribución de Google va justo debajo de la barra.
    const barra = document.querySelector('.barra')
    const creditos = document.getElementById('creditos')
    const avisarTamano = () => aLaMesa({ sid3d: 'barra', ancho: barra.offsetWidth, alto: barra.offsetHeight })
    const ubicar = (d) => {
      Object.assign(barra.style, { left: d.cx + 'px', top: d.y + 'px', bottom: 'auto', transform: 'translateX(-50%)' })
      Object.assign(creditos.style, { left: d.cx + 'px', top: d.y + barra.offsetHeight + 4 + 'px', bottom: 'auto' })
      window.__google3dBarra = { cx: d.cx, y: d.y }
    }
    if (embebido) {
      window.addEventListener('message', (e) => {
        if (e.source === window.parent && e.data && e.data.sid3d === 'lugar') ubicar(e.data)
      })
      if (window.ResizeObserver) new ResizeObserver(avisarTamano).observe(barra)
      avisarTamano()
    }
    const [lat, lng, zoom] = (location.hash.slice(1).split(',').map(Number).concat([NaN, NaN, NaN])).slice(0, 3)
    const centro = { lat: Number.isFinite(lat) ? lat : -16.5, lng: Number.isFinite(lng) ? lng : -68.15 }
    // Distancia de la cámara para ver más o menos lo mismo que en la carta (zoom de 256 px, ~1200 px de ancho).
    const z = Number.isFinite(zoom) ? zoom : 12
    const metrosPorPixel = 156543.03 * Math.cos(centro.lat * Math.PI / 180) / Math.pow(2, z)
    const distancia = Math.min(400000, Math.max(600, metrosPorPixel * 1200))
    const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'

    // ── El calco de la carta, pegado al terreno ───────────────────────────────────────────────────────────
    // Lo arma google-mapas.js (SIDGoogle.calcoDeLaCarta) con lo que está prendido en la carta 2D. Las áreas y
    // las líneas «clasifican» el 3D (se pintan sobre los tiles de Google, o sobre el globo si no hay 3D); las
    // fichas, flechas y rótulos van a la altura del suelo (op.lugar) y no los tapan los cerros.
    // op.clase: qué se pinta (los tiles de Google o, sin ellos, el globo). op.lugar(lng, lat): la posición de lo puntual.
    // Lo puntual NO va «pegado al suelo» (CLAMP_TO_GROUND): con los tiles de Google, Cesium recalcula la altura de cada
    // ficha y rótulo con cada tile que llega, y con un calco grande eso traba la navegación (Sergio, 23-10-2026: «la
    // velocidad sigue mal»). La altura se mide una vez, cuando se termina de cargar la vista (medirAlturas).
    //
    // Al cambiar algo (otra fase de un CAP, una ficha que se movió) sólo se rehace lo que cambió: cada cosa del calco
    // tiene su clave y lo que ya está dibujado queda (las áreas y líneas pegadas a los tiles tardan en armarse). Antes
    // se borraba y se volvía a armar todo: Sergio, 25-10-2026, «las unidades se cuelgan y desaparecen… no es fluido».
    // `todo`: rehacer todo (el ⛰️ Relieve × cambió: las áreas toman el estiramiento al crearse).
    function dibujarCalco(C, viewer, fuente, calco, op, todo) {
      const ents = fuente.entities
      ents.suspendEvents()
      if (todo || !fuente.sidPorClave) {
        ents.removeAll()
        fuente.sidPorClave = new Map()
      }
      const previos = fuente.sidPorClave
      const nuevos = new Map()
      let agregadas = []
      const add = (o) => {
        const e = ents.add(o)
        agregadas.push(e)
        return e
      }
      const cosa = (tipo, x, dibujar) => {
        let k = tipo + JSON.stringify(x)
        while (nuevos.has(k)) k += '+'
        const ya = previos.get(k)
        if (ya) {
          previos.delete(k)
          nuevos.set(k, ya)
          return
        }
        agregadas = []
        dibujar(x)
        nuevos.set(k, agregadas)
      }
      const color = (c, a) => {
        const x = C.Color.fromCssColorString(String(c || '#3388ff'))
        return (x || C.Color.WHITE).withAlpha(Math.max(0, Math.min(1, a)))
      }
      // dashArray de Leaflet («11 7», en píxeles) → material de guiones de Cesium (16 bits de patrón).
      const material = (l) => {
        const c = color(l.color, l.opacidad)
        const g = String(l.guiones || '').split(/[\s,]+/).map(Number).filter((n) => n > 0)
        if (g.length < 2) return c
        const total = g.reduce((a, b) => a + b, 0)
        let patron = 0
        let pos = 0
        g.forEach((largo, k) => {
          const n = Math.max(1, Math.round((largo / total) * 16))
          if (k % 2 === 0) for (let b = 0; b < n && pos + b < 16; b++) patron |= 1 << (15 - (pos + b))
          pos += n
        })
        return new C.PolylineDashMaterialProperty({ color: c, dashLength: Math.max(8, total), dashPattern: patron })
      }
      const posiciones = (coords) => C.Cartesian3.fromDegreesArray(coords.flat())
      const linea = (coords, l) => {
        if (coords.length < 2 || l.opacidad < 0.05) return
        add({ polyline: { positions: posiciones(coords), width: Math.max(1.5, Math.min(12, l.ancho)), material: material(l), clampToGround: true, classificationType: op.clase } })
      }
      const sinCierre = (anillo) => {
        const a = anillo.slice()
        if (a.length > 1 && a[0][0] === a[a.length - 1][0] && a[0][1] === a[a.length - 1][1]) a.pop()
        return a
      }
      const alSuelo = { disableDepthTestDistance: Number.POSITIVE_INFINITY }
      const puntual = (lng, lat, ent) => { ent.sidLL = [lng, lat]; return ent }

      for (const l of calco.lineas || []) cosa('l', l, () => linea(l.coords, l))
      for (const a of calco.areas || []) cosa('a', a, () => {
        for (const anillos of a.poligonos) {
          const exterior = sinCierre(anillos[0] || [])
          if (exterior.length < 3) continue
          if (a.opRelleno > 0.01) {
            const huecos = anillos.slice(1).map((h) => new C.PolygonHierarchy(posiciones(sinCierre(h))))
            add({ polygon: { hierarchy: new C.PolygonHierarchy(posiciones(exterior), huecos), material: color(a.relleno, Math.min(0.6, a.opRelleno)), classificationType: op.clase } })
          }
          for (const anillo of anillos) linea(anillo, a)
        }
      })
      for (const c of calco.circulos || []) cosa('c', c, () => {
        const [x, y] = c.centro
        if (c.opRelleno > 0.01) {
          add({ position: C.Cartesian3.fromDegrees(x, y), ellipse: { semiMajorAxis: c.radio, semiMinorAxis: c.radio, material: color(c.relleno, Math.min(0.6, c.opRelleno)), classificationType: op.clase } })
        }
        const borde = []
        for (let k = 0; k <= 72; k++) {
          const t = (k / 72) * 2 * Math.PI
          borde.push([x + (c.radio * Math.sin(t)) / (111320 * Math.cos((y * Math.PI) / 180)), y + (c.radio * Math.cos(t)) / 110574])
        }
        linea(borde, c)
      })
      for (const p of calco.puntos || []) {
        if (p.opacidad < 0.05) continue
        cosa('p', p, () => {
          // Con borde de color o con número (los «C1, C2…» de la carta): un círculo dibujado, con el número adentro.
          if (p.borde || p.texto) {
            const im = circulo(p)
            puntual(p.lng, p.lat, add({ position: op.lugar(p.lng, p.lat), billboard: Object.assign({ image: im.url, width: im.lado, height: im.lado }, alSuelo) }))
          } else puntual(p.lng, p.lat, add({ position: op.lugar(p.lng, p.lat), point: Object.assign({ pixelSize: Math.max(4, 2 * p.radio), color: color(p.color, p.opacidad), outlineColor: C.Color.WHITE, outlineWidth: 1 }, alSuelo) }))
        })
      }
      // Las fichas, un poco más grandes que en la carta (en la carta su tamaño depende del zoom): ~34 px de alto.
      for (const f of calco.fichas || []) cosa('f', f, () => {
        const b = { image: f.img, horizontalOrigin: C.HorizontalOrigin.CENTER, verticalOrigin: C.VerticalOrigin.CENTER }
        if (f.ancho > 0 && f.alto > 0) {
          const s = Math.max(1, Math.min(4, 34 / f.alto))
          Object.assign(b, { width: f.ancho * s, height: f.alto * s, horizontalOrigin: C.HorizontalOrigin.LEFT, verticalOrigin: C.VerticalOrigin.TOP, pixelOffset: new C.Cartesian2(-f.ax * s, -f.ay * s) })
        }
        puntual(f.lng, f.lat, add({ position: op.lugar(f.lng, f.lat), billboard: Object.assign(b, alSuelo) }))
      })
      // Las puntas de flecha giradas como en la carta: el giro se mide desde el norte del lugar.
      for (const f of calco.flechas || []) cosa('v', f, () => {
        const pos = op.lugar(f.lng, f.lat)
        const enu = C.Transforms.eastNorthUpToFixedFrame(pos)
        const norte = C.Cartesian3.normalize(C.Cartesian3.fromCartesian4(C.Matrix4.getColumn(enu, 1, new C.Cartesian4())), new C.Cartesian3())
        puntual(f.lng, f.lat, add({ position: pos, billboard: Object.assign({ image: f.svg, width: f.ancho * 1.4, height: f.alto * 1.4, rotation: (-f.rot * Math.PI) / 180, alignedAxis: norte }, alSuelo) }))
      })
      for (const r of calco.rotulos || []) cosa('r', r, () => {
        puntual(r.lng, r.lat, add({
          position: op.lugar(r.lng, r.lat),
          label: Object.assign({ text: r.texto, font: `700 ${Math.max(12, Math.min(22, r.tam || 12))}px Arial`, fillColor: color(r.color || '#000', 1), outlineColor: C.Color.WHITE, outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE, horizontalOrigin: C.HorizontalOrigin.CENTER, verticalOrigin: C.VerticalOrigin.CENTER }, alSuelo),
        }))
      })
      // Lo que ya no está en la carta.
      for (const lista of previos.values()) for (const e of lista) ents.remove(e)
      fuente.sidPorClave = nuevos
      ents.resumeEvents()
      viewer.scene.requestRender()
      return ents.values.length
    }

    // Un círculo de la carta con su borde y su número (C1, C2…), como imagen para el 3D (una por cada aspecto distinto).
    const circulos = new Map()
    function circulo(p) {
      const k = JSON.stringify([p.radio, p.color, p.opacidad, p.borde, p.anchoBorde, p.opRelleno, p.texto])
      if (circulos.has(k)) return circulos.get(k)
      const r = Math.max(4, Math.min(22, Number(p.radio) || 6)) * 1.2
      const b = p.borde ? Math.max(1, Math.min(5, Number(p.anchoBorde) || 2)) : 0
      const lado = Math.ceil(2 * (r + b) + 2)
      const cv = document.createElement('canvas')
      cv.width = cv.height = lado * 2
      const g = cv.getContext('2d')
      g.scale(2, 2)
      g.beginPath()
      g.arc(lado / 2, lado / 2, r, 0, 2 * Math.PI)
      g.globalAlpha = p.opRelleno == null ? Math.max(0.05, Math.min(1, p.opacidad)) : Math.max(0.6, Math.min(1, p.opRelleno))
      g.fillStyle = p.color || '#fff'
      g.fill()
      g.globalAlpha = 1
      if (b) {
        g.lineWidth = b
        g.strokeStyle = p.borde
        g.stroke()
      }
      if (p.texto) {
        const blanco = /^\s*(#fff(fff)?\b|white\b)/i
        g.fillStyle = p.borde && !blanco.test(p.borde) ? p.borde : '#111'
        g.textAlign = 'center'
        g.textBaseline = 'middle'
        let t = Math.round(r * 0.95)
        do {
          g.font = `700 ${t}px Arial`
        } while (g.measureText(p.texto).width > 2 * r - 3 && --t > 6)
        g.fillText(p.texto, lado / 2, lado / 2 + 0.5)
      }
      const im = { url: cv.toDataURL('image/png'), lado }
      circulos.set(k, im)
      return im
    }

    async function iniciar() {
      if (!window.Cesium) return aviso('No se pudo cargar el visor 3D (CesiumJS). Revisá la conexión a internet y volvé a abrir.')
      const C = window.Cesium
      const opciones = {
        // Debajo, el satélite de Esri: se ve mientras llega el 3D de Google y queda si Google no lo entrega.
        baseLayer: new C.ImageryLayer(new C.UrlTemplateImageryProvider({ url: ESRI, maximumLevel: 19, credit: new C.Credit('Tiles © Esri', true) })),
        baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
        navigationHelpButton: false, timeline: false, animation: false, infoBox: false, selectionIndicator: false, fullscreenButton: !embebido,
        // Dibuja sólo cuando algo cambia (la cámara, los tiles que llegan, el calco): quieto no gasta la máquina.
        requestRenderMode: true, maximumRenderTimeChange: Infinity,
      }
      if (embebido) opciones.creditContainer = document.getElementById('creditos')
      const viewer = new C.Viewer('lienzo', opciones)
      viewer.scene.skyAtmosphere.show = true
      window.__google3d = viewer

      let tiles = null
      const elDetalle = document.getElementById('detalle')
      elDetalle.value = DETALLE[leer('sid-g3d-detalle', 'normal')] ? leer('sid-g3d-detalle', 'normal') : 'normal'
      const aplicarDetalle = () => {
        const d = DETALLE[elDetalle.value] || DETALLE.normal
        viewer.resolutionScale = d.escala
        try { viewer.scene.msaaSamples = d.msaa } catch {}
        if (tiles) tiles.maximumScreenSpaceError = d.sse
        window.__google3dDetalle = Object.assign({ id: elDetalle.value }, d)
        viewer.scene.requestRender()
      }
      elDetalle.onchange = () => { guardar('sid-g3d-detalle', elDetalle.value); aplicarDetalle() }
      aplicarDetalle()

      // ⛰️ Relieve ×: Cesium estira los tiles de Google en la vertical, relativo a la cota del lugar mirado (así el
      // centro no se mueve y la cámara no queda bajo los cerros). Hasta saber esa cota no se estira nada: sobre el
      // nivel del mar, ×5 subiría la puna 16 km.
      let cota = null
      const elRelieve = document.getElementById('relieve-x')
      const valRelieve = Number(leer('sid-g3d-relieve', '2'))
      elRelieve.value = String(valRelieve >= 1 && valRelieve <= 5 ? valRelieve : 2)
      const estirado = { x: 1, reloj: 0 }
      const aplicarRelieve = () => {
        const x = Number(elRelieve.value) || 1
        document.getElementById('relieve-val').textContent = x.toFixed(1)
        if (cota == null) return
        viewer.scene.verticalExaggerationRelativeHeight = cota
        viewer.scene.verticalExaggeration = x
        window.__google3dRelieve = { x, cota }
        reubicar()
        // Las áreas pegadas al terreno se arman con el estiramiento del momento (Cesium lo toma al crearlas): el calco
        // se rehace un rato después de mover el deslizador.
        if (estirado.x !== x) {
          estirado.x = x
          clearTimeout(estirado.reloj)
          estirado.reloj = setTimeout(() => redibujar(true), 350)
        }
      }
      elRelieve.oninput = aplicarRelieve
      elRelieve.onchange = () => guardar('sid-g3d-relieve', elRelieve.value)
      document.getElementById('relieve-val').textContent = Number(elRelieve.value).toFixed(1)

      // ── La altura de lo puntual (fichas, flechas, rótulos) ──
      // Se mide en lo que ya está dibujado (scene.sampleHeight, sin pedir tiles nuevos) cuando la vista termina de
      // cargar, y se vuelve a medir si la cámara se acercó mucho desde la última vez (con más detalle, más exacta).
      // Se guarda sin estirar: con ⛰️ Relieve × se estira igual que los tiles (relativo a la cota del centro).
      const fuente = new C.CustomDataSource('calco')
      viewer.dataSources.add(fuente)
      let hayTiles = false
      const alturas = new Map() // 'lng,lat' → { h: metros sin estirar, d: distancia de la cámara al medirla }
      const clave = (lng, lat) => lng.toFixed(5) + ',' + lat.toFixed(5)
      const estirar = (h) => (cota == null ? h : cota + (h - cota) * (viewer.scene.verticalExaggeration || 1))
      const lugar = (lng, lat) => {
        const a = alturas.get(clave(lng, lat))
        return C.Cartesian3.fromDegrees(lng, lat, estirar(a ? a.h : hayTiles ? cota || 0 : 0) + 2)
      }
      const puntuales = () => fuente.entities.values.filter((e) => e.sidLL)
      const reubicar = () => {
        for (const e of puntuales()) e.position = lugar(e.sidLL[0], e.sidLL[1])
        viewer.scene.requestRender()
      }
      const medicion = { reloj: 0, pendientes: [] }
      const medirAlturas = () => {
        clearTimeout(medicion.reloj)
        if (!hayTiles) return
        const vista = viewer.camera.computeViewRectangle()
        const cam = viewer.camera.positionWC
        const excluir = fuente.entities.values
        medicion.pendientes = puntuales().filter((e) => {
          const [lng, lat] = e.sidLL
          if (vista && !C.Rectangle.contains(vista, C.Cartographic.fromDegrees(lng, lat))) return false
          const a = alturas.get(clave(lng, lat))
          return !a || a.d > 3 * C.Cartesian3.distance(cam, C.Cartesian3.fromDegrees(lng, lat, estirar(a.h)))
        })
        // De a 20 por vez, para no trabar el dibujo.
        const tanda = () => {
          let cambio = false
          const x = viewer.scene.verticalExaggeration || 1
          for (const e of medicion.pendientes.splice(0, 20)) {
            const [lng, lat] = e.sidLL
            let h
            try { h = viewer.scene.sampleHeight(C.Cartographic.fromDegrees(lng, lat), excluir) } catch {}
            if (!Number.isFinite(h)) continue
            const crudo = cota == null || x === 1 ? h : cota + (h - cota) / x
            alturas.set(clave(lng, lat), { h: crudo, d: C.Cartesian3.distance(cam, C.Cartesian3.fromDegrees(lng, lat, h)) })
            cambio = true
          }
          if (cambio) reubicar()
          if (medicion.pendientes.length) medicion.reloj = setTimeout(tanda, 30)
          else window.__google3dAlturas = alturas.size
        }
        tanda()
      }
      const medirLuego = () => {
        clearTimeout(medicion.reloj)
        medicion.reloj = setTimeout(medirAlturas, 400)
      }

      let ultimo = null
      let listo = false // el calco se dibuja cuando se sabe si hay 3D de Google (qué se pinta: los tiles o el globo)
      // Las imágenes de las fichas y las áreas pegadas a los tiles se terminan de armar DESPUÉS de agregarlas, y Cesium
      // (que dibuja sólo cuando algo cambia) no siempre vuelve a dibujar cuando llegan: las fichas no aparecían hasta
      // mover la cámara (Sergio, 25-10-2026: «las unidades no aparecen»). Se sigue dibujando hasta que todo esté listo.
      const espera = { reloj: 0, desde: 0 }
      const dibujarHastaListo = () => {
        espera.desde = Date.now()
        viewer.scene.requestRender()
        if (espera.reloj) return
        espera.reloj = setInterval(() => {
          viewer.scene.requestRender()
          const t = Date.now() - espera.desde
          if ((t > 3000 && viewer.dataSourceDisplay.ready) || t > 20000) {
            clearInterval(espera.reloj)
            espera.reloj = 0
            window.__google3dListo = (window.__google3dListo || 0) + 1
          }
        }, 150)
      }
      const redibujar = (todo) => {
        if (!ultimo || !listo) return
        window.__calcoDibujado = dibujarCalco(C, viewer, fuente, ultimo, { clase: hayTiles ? C.ClassificationType.CESIUM_3D_TILE : C.ClassificationType.TERRAIN, lugar }, todo === true)
        dibujarHastaListo()
        medirLuego()
      }
      window.addEventListener('message', (e) => {
        if (e.source !== window.parent || !e.data) return
        if (e.data.sid3d === 'calco') {
          ultimo = e.data.calco || {}
          redibujar()
        } else if (e.data.sid3d === 'relieve') {
          // El «Relieve ×» de la barra de la Mesa (arriba) también mueve el de acá.
          const x = Math.max(1, Math.min(5, Math.round(Number(e.data.x) * 10) / 10))
          if (!Number.isFinite(x)) return
          elRelieve.value = String(x)
          guardar('sid-g3d-relieve', x)
          aplicarRelieve()
        }
      })
      document.getElementById('ver-calco').onchange = (e) => { fuente.show = e.target.checked; viewer.scene.requestRender() }
      document.getElementById('recargar').onclick = () => aLaMesa({ sid3d: 'pedirCalco' })
      document.getElementById('volver').onclick = () => aLaMesa({ sid3d: 'cerrar' })
      aLaMesa({ sid3d: 'listo' })

      const punto = C.Cartesian3.fromDegrees(centro.lng, centro.lat, 0)
      const inclinada = () => {
        viewer.camera.lookAt(punto, new C.HeadingPitchRange(0, C.Math.toRadians(-35), distancia))
        viewer.camera.lookAtTransform(C.Matrix4.IDENTITY)
      }
      document.getElementById('oblicua').onclick = inclinada
      document.getElementById('cenital').onclick = () => {
        const c = C.Cartographic.fromCartesian(punto)
        viewer.camera.flyTo({ destination: C.Cartesian3.fromRadians(c.longitude, c.latitude, c.height + distancia), orientation: { heading: 0, pitch: C.Math.toRadians(-90), roll: 0 }, duration: 1.2 })
      }
      document.getElementById('norte').onclick = () => {
        viewer.camera.flyTo({ destination: viewer.camera.positionWC.clone(), orientation: { heading: 0, pitch: viewer.camera.pitch, roll: 0 }, duration: .8 })
      }
      inclinada()

      try {
        tiles = await C.createGooglePhotorealistic3DTileset({ key: window.SIDGoogle.CLAVE, onlyUsingWithGoogleGeocoder: true }, { showCreditsOnScreen: true, maximumScreenSpaceError: (DETALLE[elDetalle.value] || DETALLE.normal).sse })
        viewer.scene.primitives.add(tiles)
        // Con el 3D de Google el globo (y el satélite de Esri, con su atribución) se saca: si no, asoma entre los
        // tiles. Lo trazado se pinta sobre los tiles.
        viewer.scene.globe.show = false
        viewer.imageryLayers.removeAll()
        window.__google3dTiles = tiles
        hayTiles = true
        // Cuando la vista termina de cargar (después de moverse), se mide la altura de lo puntual que se ve.
        tiles.allTilesLoaded.addEventListener(medirLuego)
      } catch (e) {
        window.__google3dFallo = String(e && e.message ? e.message : e)
        const texto = 'Google no entregó el 3D (' + window.__google3dFallo + '). Puede ser el cupo del día o la conexión.'
        document.getElementById('relieve').title = 'Sin el 3D de Google no hay relieve para exagerar'
        listo = true
        redibujar(true)
        return embebido ? aviso(texto + ' Se muestra el calco sobre el satélite de Esri, sin relieve.', true) : aviso(texto)
      }
      listo = true
      redibujar(true)
      // Los tiles 3D no tienen altura conocida antes de cargar: se apunta al nivel del mar y, cuando se sabe la
      // cota del centro, se corrige la mira para que la cámara no quede bajo el terreno de la puna. Con esa cota se
      // activa ⛰️ Relieve ×.
      const medirCota = async (intento) => {
        const lugarCentro = C.Cartographic.fromDegrees(centro.lng, centro.lat)
        let h = null
        try {
          const [c] = await viewer.scene.sampleHeightMostDetailed([lugarCentro], fuente.entities.values)
          if (c && Number.isFinite(c.height)) h = c.height
        } catch {}
        // Si con el máximo detalle no se pudo (los tiles más finos no llegaron), con lo que ya se ve.
        if (h == null) try { const v = viewer.scene.sampleHeight(lugarCentro, fuente.entities.values); if (Number.isFinite(v)) h = v } catch {}
        if (h != null) {
          const alto = C.Cartesian3.fromDegrees(centro.lng, centro.lat, h)
          viewer.camera.lookAt(alto, new C.HeadingPitchRange(0, C.Math.toRadians(-35), distancia))
          viewer.camera.lookAtTransform(C.Matrix4.IDENTITY)
          punto.x = alto.x; punto.y = alto.y; punto.z = alto.z
          cota = h
        }
        // Si los tiles del centro todavía no llegaron, se vuelve a medir (sin cota, el relieve no se estira).
        if (cota == null) return intento < 12 && setTimeout(() => medirCota(intento + 1), 2500)
        elRelieve.disabled = false
        document.getElementById('relieve').classList.remove('apagado')
        document.getElementById('relieve').title = 'Exagerar el relieve del 3D de Google (también lo mueve el «Relieve ×» de la barra de arriba de la Mesa)'
        aplicarRelieve()
        reubicar()
        medirLuego()
      }
      setTimeout(() => medirCota(1), 2500)
    }
    iniciar()
  </script>
</body>
</html>
