<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google 3D — SIDECEME</title>
  <!-- 🏙️ El 3D realista de Google (Photorealistic 3D Tiles, Map Tiles API) para reconocer el terreno del ejercicio.
       Lo abre «🏙️ 3D realista», en el selector de mapa base de la carta, en el lugar que se estaba mirando:
       3d.html#lat,lng,zoom. Usa la misma clave que google-mapas.js. CesiumJS dibuja los tiles. -->
  <script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/'</script>
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css">
  <script src="./google-mapas.js?v=20261023"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0e13; overflow: hidden; font: 600 12px Arial, sans-serif; color: #c3ced9 }
    #lienzo { position: absolute; inset: 0 }
    .barra { position: absolute; left: 12px; top: 12px; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: calc(100% - 24px);
      padding: 6px 10px; background: rgba(10, 16, 24, .9); border: 1px solid rgba(15, 181, 201, .45); border-radius: 6px }
    .barra b { color: #3de1f5; letter-spacing: .04em }
    .barra button { background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .18); color: #c3ced9; border-radius: 5px; padding: 4px 9px; font: 600 11px Arial, sans-serif; cursor: pointer }
    .barra button:hover { border-color: #0fb5c9; color: #3de1f5 }
    .ayuda { color: #8fa1b3; font-weight: 400 }
    .aviso { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; max-width: min(520px, 90vw); padding: 14px 18px; border-radius: 8px;
      background: rgba(12, 18, 24, .95); border: 1px solid #d9a400; color: #ffd75e; text-align: center; line-height: 1.5; display: none }
    @media (max-width: 600px) { .ayuda { display: none } }
  </style>
</head>
<body>
  <div id="lienzo"></div>
  <div class="barra">
    <b>🏙️ GOOGLE 3D</b>
    <button id="cenital" title="Mirar desde arriba">⬇️ Desde arriba</button>
    <button id="oblicua" title="Volver a la vista inclinada del principio">↗️ Inclinada</button>
    <button id="norte" title="Girar para que el norte quede arriba">🧭 Norte</button>
    <span class="ayuda">Arrastrá para moverte · rueda para acercar · Ctrl + arrastrar (o clic derecho) para inclinar y girar</span>
  </div>
  <div class="aviso" id="aviso"></div>
  <script>
    'use strict'
    const aviso = (t) => { const a = document.getElementById('aviso'); a.textContent = t; a.style.display = 'block' }
    const [lat, lng, zoom] = (location.hash.slice(1).split(',').map(Number).concat([NaN, NaN, NaN])).slice(0, 3)
    const centro = { lat: Number.isFinite(lat) ? lat : -16.5, lng: Number.isFinite(lng) ? lng : -68.15 }
    // Distancia de la cámara para ver más o menos lo mismo que en la carta (zoom de 256 px, ~1200 px de ancho).
    const z = Number.isFinite(zoom) ? zoom : 12
    const metrosPorPixel = 156543.03 * Math.cos(centro.lat * Math.PI / 180) / Math.pow(2, z)
    const distancia = Math.min(400000, Math.max(600, metrosPorPixel * 1200))

    async function iniciar() {
      if (!window.Cesium) return aviso('No se pudo cargar el visor 3D (CesiumJS). Revisá la conexión a internet y volvé a abrir.')
      const C = window.Cesium
      const viewer = new C.Viewer('lienzo', {
        globe: false, baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
        navigationHelpButton: false, timeline: false, animation: false, infoBox: false, selectionIndicator: false, fullscreenButton: true,
      })
      viewer.scene.skyAtmosphere.show = true
      try {
        const tiles = await C.createGooglePhotorealistic3DTileset({ key: window.SIDGoogle.CLAVE, onlyUsingWithGoogleGeocoder: true }, { showCreditsOnScreen: true })
        viewer.scene.primitives.add(tiles)
      } catch (e) {
        return aviso('Google no entregó el 3D (' + (e && e.message ? e.message : e) + '). Puede ser el cupo del día o la conexión.')
      }
      const punto = C.Cartesian3.fromDegrees(centro.lng, centro.lat, 0)
      const inclinada = () => {
        viewer.camera.lookAt(punto, new C.HeadingPitchRange(0, C.Math.toRadians(-35), distancia))
        viewer.camera.lookAtTransform(C.Matrix4.IDENTITY)
      }
      // Los tiles 3D no tienen altura conocida antes de cargar: se apunta al nivel del mar y, cuando se sabe la
      // cota del centro, se corrige la mira para que la cámara no quede bajo el terreno de la puna.
      inclinada()
      setTimeout(async () => {
        try {
          const [c] = await viewer.scene.sampleHeightMostDetailed([C.Cartographic.fromDegrees(centro.lng, centro.lat)])
          if (c && Number.isFinite(c.height)) {
            const alto = C.Cartesian3.fromDegrees(centro.lng, centro.lat, c.height)
            viewer.camera.lookAt(alto, new C.HeadingPitchRange(0, C.Math.toRadians(-35), distancia))
            viewer.camera.lookAtTransform(C.Matrix4.IDENTITY)
            punto.x = alto.x; punto.y = alto.y; punto.z = alto.z
          }
        } catch {}
      }, 2500)
      document.getElementById('oblicua').onclick = inclinada
      document.getElementById('cenital').onclick = () => {
        const c = C.Cartographic.fromCartesian(punto)
        viewer.camera.flyTo({ destination: C.Cartesian3.fromRadians(c.longitude, c.latitude, c.height + distancia), orientation: { heading: 0, pitch: C.Math.toRadians(-90), roll: 0 }, duration: 1.2 })
      }
      document.getElementById('norte').onclick = () => {
        viewer.camera.flyTo({ destination: viewer.camera.positionWC.clone(), orientation: { heading: 0, pitch: viewer.camera.pitch, roll: 0 }, duration: .8 })
      }
      window.__google3d = viewer
    }
    iniciar()
  </script>
</body>
</html>
