name: Build Google Earth importer

on:
  push:
    branches:
      - chatgpt/ge-import-calcos

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ge-import-calcos
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check importer syntax
        run: node --check calcos/importar-google-earth.js

      - name: Build patched Mesa bundle
        run: node calcos/pruebas/aplicar-importador-ge.cjs

      - name: Verify generated integration
        run: |
          test -f calcos/assets/index-ge-import-20260929.js
          grep -q 'sid-btn-complementar-ge' calcos/assets/index-ge-import-20260929.js
          grep -q '__SIDECEME_IMPORT_STATE' calcos/assets/index-ge-import-20260929.js
          grep -q '__SIDECEME_JSZIP' calcos/assets/index-ge-import-20260929.js
          grep -q 'index-ge-import-20260929.js' calcos/index.html
          grep -q 'YSe=1e3' calcos/assets/index-ge-import-20260929.js

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calcos/assets/index-ge-import-20260929.js calcos/index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Construye Mesa con importación Google Earth"
          git push
