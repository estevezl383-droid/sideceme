name: Varias áreas de interés
on:
  pull_request:
    paths:
      - 'calcos/areas-interes/**'
      - 'calcos/visibilidad/**'
      - 'calcos/paquetes/v1/paquetes.mjs'
      - 'calcos/modalidad/modalidad.js'
      - 'calcos/index.html'
      - 'calcos/assets/index-areas-interes-20261028.js'
      - 'calcos/assets/index-vista-plegada-20261028.js'
      - 'calcos/assets/index-cursos-g2-g3-20261029.js'
      - 'calcos/fuegos/plan-fuegos.js'
      - 'calcos/concepto-operacion/v1/carta.js'
      - 'calcos/pruebas/*cursos*'
      - 'calcos/pruebas/e2e/cursos-g2-g3.cjs'
      - 'calcos/pruebas/*vista*'
      - 'calcos/pruebas/visibilidad.mjs'
      - 'calcos/pruebas/e2e/vista-plegada.cjs'
      - 'calcos/pruebas/e2e/paquetes.cjs'
      - 'calcos/pruebas/*areas-interes*'
      - 'calcos/pruebas/e2e/areas-interes.cjs'
      - 'calcos/pruebas/e2e/areas-interes-vistas.cjs'
      - '.github/workflows/areas-interes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Modelo y compilado reproducible
        run: |
          npm ci --prefix calcos/pruebas
          npm run test:areas-interes --prefix calcos/pruebas
          npm run test:visibilidad --prefix calcos/pruebas
          npm run test:cursos-visibilidad --prefix calcos/pruebas
          node calcos/pruebas/paquetes.mjs
          node calcos/pruebas/construir-cursos-g2-g3.js
          git diff --exit-code -- calcos/index.html calcos/assets/index-cursos-g2-g3-20261029.js
          node --check calcos/assets/index-cursos-g2-g3-20261029.js
      - name: Preparar Chromium
        run: |
          npm install --prefix /tmp/prueba-areas-interes playwright@1.51.1
          node /tmp/prueba-areas-interes/node_modules/playwright/cli.js install --with-deps chromium
      - name: Cinco áreas, calcos y guardado en el navegador
        env:
          PLAYWRIGHT_MODULE: /tmp/prueba-areas-interes/node_modules/playwright
        run: |
          npm run e2e:areas-interes --prefix calcos/pruebas
          npm run e2e:visibilidad --prefix calcos/pruebas
          npm run e2e:cursos-g2-g3 --prefix calcos/pruebas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-areas-interes
          path: |
            calcos/pruebas/salidas-areas-interes/
            calcos/pruebas/salidas-vista-plegada/
            calcos/pruebas/salidas-cursos-g2-g3/
          retention-days: 7
