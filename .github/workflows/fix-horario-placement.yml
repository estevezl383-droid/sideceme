name: Fix horario patch placement
on:
  push:
    branches:
      - fix/horario-integrado-editor-419
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mover referencias al final real del documento
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='''\n<link rel="stylesheet" href="assets/horario-419.css?v=2.9.419">\n<script src="assets/horario-419.js?v=2.9.419"></script>\n'''
          s=s.replace(tag,"")
          pos=s.rfind("</body>")
          if pos < 0:
              raise SystemExit("No se encontró </body> real")
          s=s[:pos]+tag+s[pos:]
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: cargar parche horario al final real del index"
          git push
