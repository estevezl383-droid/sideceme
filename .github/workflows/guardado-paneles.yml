name: Autoguardado y paneles sin cruce
on:
  pull_request:
    paths:
      - 'calcos/guardado/**'
      - 'calcos/modalidad/**'
      - 'calcos/pandora/**'
      - 'calcos/version/**'
      - 'calcos/index.html'
      - 'calcos/assets/index-guardado-20261010.js'
      - 'calcos/pruebas/autoguardado.mjs'
      - 'calcos/pruebas/*guardado*'
      - 'calcos/pruebas/modalidad.cjs'
      - 'calcos/pruebas/ia-profesor.cjs'
      - 'calcos/pruebas/carpeta-profesor.cjs'
      - 'calcos/pruebas/respuesta-cmoc-profesor.md'
      - 'calcos/pruebas/e2e/carpeta-profesor.cjs'
      - 'calcos/pruebas/e2e/autoguardado.cjs'
      - 'calcos/pruebas/e2e/paneles-sin-cruce.cjs'
      - 'calcos/pruebas/e2e/modalidad.cjs'
      - 'calcos/pruebas/e2e/aviso-version.cjs'
      - 'calcos/pruebas/e2e/servidor-falso.js'
      - '.github/workflows/guardado-paneles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Motor, catálogo y reversibilidad
        run: |
          npm ci --prefix calcos/pruebas
          node --check calcos/assets/index-guardado-20261010.js
          node --check calcos/modalidad/modalidad.js
          node --check calcos/modalidad/carpeta.js
          node --check calcos/version/aviso-version.js
          node calcos/pruebas/autoguardado.mjs
          node calcos/pruebas/modalidad.cjs
          node calcos/pruebas/ia-profesor.cjs
          node calcos/pruebas/carpeta-profesor.cjs
          node calcos/pruebas/reemplazos-compilado.js
      - name: Preparar navegador
        run: |
          npm install --prefix /tmp/prueba-guardado playwright@1.51.1
          node /tmp/prueba-guardado/node_modules/playwright/cli.js install --with-deps chromium
      - name: La Mesa real en Chromium
        env:
          PLAYWRIGHT_MODULE: /tmp/prueba-guardado/node_modules/playwright
        run: |
          node calcos/pruebas/e2e/autoguardado.cjs
          node calcos/pruebas/e2e/paneles-sin-cruce.cjs
          node calcos/pruebas/e2e/modalidad.cjs
          node calcos/pruebas/e2e/carpeta-profesor.cjs
          node calcos/pruebas/e2e/aviso-version.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision-guardado-paneles
          path: |
            calcos/pruebas/salidas-guardado/
            calcos/pruebas/salidas-paneles/
            calcos/pruebas/salidas-carpeta/
          retention-days: 7
