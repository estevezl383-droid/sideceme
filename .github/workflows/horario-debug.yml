name: horario-patch
on:
  push:
    branches:
      - chatgpt/horario-editor-20260929
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[horario-patch-output]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/horario-editor-20260929
      - name: Apply horario patch
        run: python calcos/pruebas/aplicar-horario-2026-09-29.py
      - name: Sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='replace')
          must=[
            "✏️ EDITAR A MANO — horas, texto, agregar o eliminar",
            "function plpEncManualGuardar",
            "function plpEncManualEliminar",
            "function plpEncManualNueva",
            "function plpZoom",
            "if(p.ocultar_base) return;",
            "if(u.mover) return true;"
          ]
          for x in must:
            assert x in s, x
          assert "if(u.mover || u.aprobar) h+='<button class=\"plp-enc-gr\"" not in s
          print("sanity OK")
          PY
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='replace')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks:
            raise SystemExit('No inline scripts found')
          js=max(blocks,key=len)
          Path('/tmp/sideceme-main.js').write_text(js,encoding='utf-8')
          print('largest inline script chars',len(js))
          PY
          node --check /tmp/sideceme-main.js
      - name: Commit patched index
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add index.html
          git commit -m "Horario integrado: editor manual, zoom y permisos [horario-patch-output]"
          git push
