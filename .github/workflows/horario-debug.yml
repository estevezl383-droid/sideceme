name: horario-debug
on:
  push:
    branches:
      - chatgpt/horario-editor-20260929
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, '[horario-module-output]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/horario-editor-20260929
      - name: Extract horario module
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='replace')
          center=s.find('ENCAJAR EL DÍA')
          if center < 0:
            raise SystemExit('No se encontró ENCAJAR EL DÍA')
          a=max(0,center-180000)
          b=min(len(s),center+220000)
          chunk=s[a:b]
          Path('horario-module.txt').write_text(
            f'INDEX_RANGE={a}:{b}\nCENTER={center}\n\n'+chunk,
            encoding='utf-8'
          )
          PY
      - name: Commit module extract
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add horario-module.txt
          git commit -m "Extrae módulo de horario para edición [horario-module-output]"
          git push
