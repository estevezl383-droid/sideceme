name: Apply horario v2.9.419
on:
  push:
    branches:
      - fix/horario-integrado-editor-419
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insertar parche del horario
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          tag='''\n<link rel="stylesheet" href="assets/horario-419.css?v=2.9.419">\n<script src="assets/horario-419.js?v=2.9.419"></script>\n'''
          if "assets/horario-419.js?v=2.9.419" not in s:
              if "</body>" not in s:
                  raise SystemExit("No se encontró </body>")
              s=s.replace("</body>",tag+"</body>",1)
              p.write_text(s,encoding="utf-8")
          PY
          if git diff --quiet -- index.html; then
            echo "Index ya estaba actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "v2.9.419: cargar parche del horario integrado"
          git push
